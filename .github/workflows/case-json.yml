name: 案件JSON作成フロー

on:
  workflow_dispatch:
    inputs:
      start_month:
        description: "開始月 YYYY-MM。空欄なら183日の窓が閉じた直近の月"
        required: false
        default: ""
        type: string
      end_month:
        description: "終了月 YYYY-MM。空欄なら開始月と同じ（その1ヶ月だけ）"
        required: false
        default: ""
        type: string
      update_results:
        description: "結果をリポジトリに保存する"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: case-json
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build case JSON from ID lists and XBRL
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          ARGS=()
          START="${{ github.event.inputs.start_month }}"
          END="${{ github.event.inputs.end_month }}"
          if [ -n "$START" ]; then
            ARGS+=(--from-month "$START")
          fi
          if [ -n "$END" ]; then
            ARGS+=(--to-month "$END")
          fi
          python -m tob.case_json "${ARGS[@]}" --id-list-dir output/id_lists --out-dir output/cases

      - name: Upload JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-json
          path: output/cases
          retention-days: 14
          if-no-files-found: warn

      - name: Commit case JSON if requested
        if: ${{ github.event.inputs.update_results == 'true' && success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git pull --rebase origin master
          git add output/cases
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update TOB case JSON $(date -u +%Y-%m-%d)"
            git push
          fi
