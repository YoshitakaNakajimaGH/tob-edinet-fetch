name: Fetch TOB

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Start year (YYYY). Empty = current year"
        required: false
        default: ""
        type: string
      end_year:
        description: "End year (YYYY). Empty = current year (through today)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 0 * * 1-5"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch TOB list and rebuild cases
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          START="${{ github.event.inputs.start_year }}"
          END="${{ github.event.inputs.end_year }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python fetch_tob.py --recent-days 35 --out output/tob_list.csv --cases-out output/tob_cases.csv
          else
            ARGS=()
            if [ -n "$START" ]; then
              ARGS+=(--from-year "$START")
            fi
            if [ -n "$END" ]; then
              ARGS+=(--to-year "$END")
            fi
            if [ ${#ARGS[@]} -eq 0 ]; then
              ARGS+=(--from-year "$(date +%Y)" --to-year "$(date +%Y)")
            fi
            python fetch_tob.py "${ARGS[@]}" --out output/tob_list.csv --cases-out output/tob_cases.csv
          fi

      - name: Commit CSV if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          git add output/tob_list.csv output/tob_cases.csv
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update TOB list and cases $(date -u +%Y-%m-%d)"
            git push
          fi
