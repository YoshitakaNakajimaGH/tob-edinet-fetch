name: Fetch TOB

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "開始年"
        required: true
        type: choice
        default: "2026"
        options:
          - "2027"
          - "2026"
          - "2025"
          - "2024"
          - "2023"
          - "2022"
          - "2021"
          - "2020"
          - "2019"
          - "2018"
          - "2017"
      end_year:
        description: "終了年（今年を選んだ場合は実行日まで）"
        required: true
        type: choice
        default: "2026"
        options:
          - "2027"
          - "2026"
          - "2025"
          - "2024"
          - "2023"
          - "2022"
          - "2021"
          - "2020"
          - "2019"
          - "2018"
          - "2017"
      sleep_seconds:
        description: "API呼び出し間隔（秒）。429等が出たら1.0〜2.0に増やす"
        required: false
        default: "0.5"
        type: string
  schedule:
    - cron: "0 0 * * 1-5"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch TOB list and rebuild cases
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m tob.fetch_tob --recent-days 35
          else
            python -m tob.fetch_tob \
              --from-year "${{ github.event.inputs.start_year }}" \
              --to-year "${{ github.event.inputs.end_year }}" \
              --sleep "${{ github.event.inputs.sleep_seconds }}"
          fi

      - name: Commit CSV if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          git add output
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update TOB list and cases $(date -u +%Y-%m-%d)"
            git push
          fi
