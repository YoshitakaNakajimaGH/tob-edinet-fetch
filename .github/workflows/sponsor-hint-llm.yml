name: Sponsor Hint LLM

# Enriched CSV テキストから Gemini で SponsorHint を推論（手動）
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "batch"
        type: choice
        options:
          - dry_run
          - blank
          - batch
          - all
      limit:
        description: "Batch size (batch mode)"
        required: false
        default: "50"
        type: string
      offset:
        description: "Batch offset (batch mode)"
        required: false
        default: "0"
        type: string
      case_id:
        description: "Single CaseID (overrides mode when set)"
        required: false
        default: ""
        type: string
      model:
        description: "Gemini model"
        required: false
        default: "gemini-2.5-flash"
        type: string
      apply_cases:
        description: "Write SponsorHint to output/current/tob_cases.csv"
        required: false
        default: true
        type: boolean

jobs:
  sponsor-hint-llm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sponsor hint LLM
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SCRIPT=experiments/sponsor-hint-llm/scripts/run_sponsor_hint_llm.py
          ARGS=(--model "${{ inputs.model }}")
          if [ "${{ inputs.apply_cases }}" = "true" ]; then
            ARGS+=(--apply-cases)
          fi
          if [ -n "${{ inputs.case_id }}" ]; then
            python "$SCRIPT" --case-id "${{ inputs.case_id }}" "${ARGS[@]}"
            exit 0
          fi
          case "${{ inputs.mode }}" in
            dry_run)
              python "$SCRIPT" --dry-run --limit 5 "${ARGS[@]}"
              ;;
            blank)
              python "$SCRIPT" --only-blank "${ARGS[@]}"
              ;;
            batch)
              python "$SCRIPT" --limit "${{ inputs.limit }}" --offset "${{ inputs.offset }}" "${ARGS[@]}"
              ;;
            all)
              python "$SCRIPT" "${ARGS[@]}"
              ;;
            *)
              echo "Unknown mode: ${{ inputs.mode }}"
              exit 1
              ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-hint-llm-${{ github.run_id }}
          path: |
            output/current/sponsor_hint_llm.json
            experiments/sponsor-hint-llm/output/sponsor_hint_diff.csv
          if-no-files-found: warn

      - name: Commit sidecar and cases CSV
        if: inputs.mode != 'dry_run' && inputs.apply_cases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/current/sponsor_hint_llm.json output/current/tob_cases.csv experiments/sponsor-hint-llm/output/sponsor_hint_diff.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update SponsorHint via Gemini LLM [skip ci]"
            git push
          fi
