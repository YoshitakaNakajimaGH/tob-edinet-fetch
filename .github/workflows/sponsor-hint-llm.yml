name: Sponsor Hint LLM

# SponsorHint が空の案件を優先し、最大10件ずつ Gemini で推論（入力不要・Run のみ）
on:
  workflow_dispatch:

jobs:
  sponsor-hint-llm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SponsorHint LLM
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python experiments/sponsor-hint-llm/scripts/run_sponsor_hint_llm.py --workflow --apply-cases

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-hint-llm-${{ github.run_id }}
          path: |
            output/current/sponsor_hint_llm.json
            experiments/sponsor-hint-llm/output/sponsor_hint_diff.csv
          if-no-files-found: warn

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/current/sponsor_hint_llm.json output/current/tob_cases.csv experiments/sponsor-hint-llm/output/sponsor_hint_diff.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update SponsorHint via Gemini LLM [skip ci]"
            git push
          fi
